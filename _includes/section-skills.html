<section class="skills section" id="skills" data-scene="s6" aria-label="Skills">
  <header class="section__head">
    <p class="section__kicker mono" data-reveal>Capabilities</p>
    <h2 class="section__title" data-split-lines>The constellation</h2>
    <p class="section__lede" data-reveal>
      Not a list of logos — a map of how the pieces connect. Hover a node to
      trace its neighborhood.
    </p>
  </header>

  <div class="skills__wrap">
    <svg class="skills__svg" viewBox="0 0 600 540" role="img" aria-labelledby="skills-svg-title" data-constellation>
      <title id="skills-svg-title">Skill constellation: mobile, web, cloud, AI, and hardware skills connected to Nabhan at the center</title>

      <!-- edges: center → group hubs -->
      <path class="edge" data-group="mobile" d="M300 270 L150 120"/>
      <path class="edge" data-group="web" d="M300 270 L455 105"/>
      <path class="edge" data-group="cloud" d="M300 270 L490 330"/>
      <path class="edge" data-group="ai" d="M300 270 L300 460"/>
      <path class="edge" data-group="tools" d="M300 270 L110 380"/>

      <!-- edges: hubs → leaves -->
      <path class="edge" data-group="mobile" d="M150 120 L60 70"/>
      <path class="edge" data-group="mobile" d="M150 120 L215 42"/>
      <path class="edge" data-group="mobile" d="M150 120 L72 185"/>
      <path class="edge" data-group="web" d="M455 105 L368 38"/>
      <path class="edge" data-group="web" d="M455 105 L540 52"/>
      <path class="edge" data-group="web" d="M455 105 L555 170"/>
      <path class="edge" data-group="cloud" d="M490 330 L568 270"/>
      <path class="edge" data-group="cloud" d="M490 330 L562 395"/>
      <path class="edge" data-group="cloud" d="M490 330 L468 445"/>
      <path class="edge" data-group="ai" d="M300 460 L390 498"/>
      <path class="edge" data-group="ai" d="M300 460 L218 505"/>
      <path class="edge" data-group="tools" d="M110 380 L38 310"/>
      <path class="edge" data-group="tools" d="M110 380 L45 455"/>
      <path class="edge" data-group="tools" d="M110 380 L185 455"/>

      <!-- center -->
      <g class="node node--hub" data-group="all">
        <circle cx="300" cy="270" r="11"/>
        <text x="300" y="296">NABHAN</text>
      </g>

      <!-- group hubs -->
      <g class="node node--group" data-group="mobile"><circle cx="150" cy="120" r="8"/><text x="150" y="144">Mobile</text></g>
      <g class="node node--group" data-group="web"><circle cx="455" cy="105" r="8"/><text x="455" y="129">Web</text></g>
      <g class="node node--group" data-group="cloud"><circle cx="490" cy="330" r="8"/><text x="490" y="354">Cloud</text></g>
      <g class="node node--group" data-group="ai"><circle cx="300" cy="460" r="8"/><text x="300" y="484">AI</text></g>
      <g class="node node--group" data-group="tools"><circle cx="110" cy="380" r="8"/><text x="110" y="404">Hardware</text></g>

      <!-- leaves -->
      <g class="node" data-group="mobile"><circle cx="60" cy="70" r="5"/><text x="60" y="92">Flutter</text></g>
      <g class="node" data-group="mobile"><circle cx="215" cy="42" r="5"/><text x="215" y="64">Dart</text></g>
      <g class="node" data-group="mobile"><circle cx="72" cy="185" r="5"/><text x="72" y="207">FCM</text></g>
      <g class="node" data-group="web"><circle cx="368" cy="38" r="5"/><text x="368" y="60">Next.js</text></g>
      <g class="node" data-group="web"><circle cx="540" cy="52" r="5"/><text x="540" y="74">React</text></g>
      <g class="node" data-group="web"><circle cx="555" cy="170" r="5"/><text x="548" y="192">TypeScript</text></g>
      <g class="node" data-group="cloud"><circle cx="568" cy="270" r="5"/><text x="558" y="292">Firebase</text></g>
      <g class="node" data-group="cloud"><circle cx="562" cy="395" r="5"/><text x="554" y="417">Firestore</text></g>
      <g class="node" data-group="cloud"><circle cx="468" cy="445" r="5"/><text x="468" y="467">GCP</text></g>
      <g class="node" data-group="ai"><circle cx="390" cy="498" r="5"/><text x="390" y="520">Gemini</text></g>
      <g class="node" data-group="ai"><circle cx="218" cy="505" r="5"/><text x="218" y="527">Claude</text></g>
      <g class="node" data-group="tools"><circle cx="38" cy="310" r="5"/><text x="48" y="332">ESP32</text></g>
      <g class="node" data-group="tools"><circle cx="45" cy="455" r="5"/><text x="55" y="477">GitHub</text></g>
      <g class="node" data-group="tools"><circle cx="185" cy="455" r="5"/><text x="185" y="477">Figma</text></g>
    </svg>

    <dl class="skills__groups" data-reveal-group>
      {% for group in site.data.skills.groups %}
      <div class="skills__group">
        <dt class="mono">{{ group.name }}</dt>
        <dd>{{ group.items | join: ' · ' }}</dd>
      </div>
      {% endfor %}
    </dl>
  </div>
</section>
