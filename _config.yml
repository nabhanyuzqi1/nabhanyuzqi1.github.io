# Build
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: case-study
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.png

sass:
  style: compressed

exclude:
  - remotion
  - prompts
  - docs
  - scripts
  - checklist
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/images-needed.md
  - vendor
  - node_modules
