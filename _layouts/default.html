<!doctype html>
<html lang="{{ site.lang }}" class="no-js">
<head>
  {% include head.html %}
</head>
<body>
  {% include nav.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  {% if page.url == "/" %}
  <script type="module" src="{{ '/assets/js/hero-field.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
