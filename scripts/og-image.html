<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #060608; color: #f4f4f5;
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    position: relative; display: flex; flex-direction: column;
    justify-content: center; padding: 80px;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 78% 18%, rgba(124,108,255,0.22), transparent 62%),
      radial-gradient(ellipse 55% 45% at 15% 88%, rgba(255,180,84,0.18), transparent 65%);
  }
  .grid {
    position: absolute; inset: 0; opacity: 0.5;
    background-image:
      linear-gradient(rgba(244,244,245,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244,244,245,0.07) 1px, transparent 1px);
    background-size: 72px 72px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 78%);
  }
  .kicker {
    font-family: ui-monospace, monospace; font-size: 20px; letter-spacing: 0.35em;
    color: #ffb454; margin-bottom: 28px; position: relative;
  }
  h1 { font-size: 96px; font-weight: 700; letter-spacing: -3px; line-height: 1.02; position: relative; text-transform: uppercase; }
  h1 em { font-style: normal; color: transparent; -webkit-text-stroke: 2px #ffb454; }
  .sub { margin-top: 30px; font-size: 28px; color: #9a9aa3; position: relative; }
  .url { position: absolute; bottom: 56px; left: 80px; font-family: ui-monospace, monospace; font-size: 22px; letter-spacing: 0.18em; color: #f4f4f5; }
  .dot { position: absolute; bottom: 60px; right: 80px; width: 14px; height: 14px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 24px rgba(74,222,128,0.9); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <p class="kicker">NABHAN YUZQI AL MUBAROK</p>
  <h1>Building<br><em>production</em> software.</h1>
  <p class="sub">Fullstack Developer &amp; Founder — Flutter · Next.js · Firebase · IoT</p>
  <p class="url">nabhanyuzqi1.github.io</p>
  <div class="dot"></div>
</body>
</html>
