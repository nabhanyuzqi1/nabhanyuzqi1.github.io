<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0a0c12; color: #edeff6;
    font-family: 'Clash Display', sans-serif;
    position: relative; display: flex; flex-direction: column;
    justify-content: flex-end; padding: 72px 80px;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 45% at 78% 8%, rgba(139,157,255,0.16), transparent 65%),
      radial-gradient(40% 30% at 12% 88%, rgba(245,197,107,0.08), transparent 70%);
  }
  .chip {
    position: absolute; top: 64px; left: 80px;
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid rgba(237,239,246,0.16); border-radius: 99px; padding: 10px 20px;
    font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: 0.12em;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #5ee29a; box-shadow: 0 0 12px #5ee29a; }
  h1 { font-weight: 700; text-transform: uppercase; line-height: 0.92; letter-spacing: -2px; font-size: 148px; position: relative; }
  h1 .stroke { color: transparent; -webkit-text-stroke: 2px #edeff6; }
  .sub { margin-top: 26px; font-family: 'Satoshi', sans-serif; font-size: 27px; color: #8a90a3; position: relative; }
  .sub b { color: #edeff6; }
  .url { position: absolute; top: 74px; right: 80px; font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.14em; color: #8b9dff; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="chip"><span class="dot"></span>OPEN TO WORK — REMOTE / RELOCATION</div>
  <div class="url">nabhanyuzqi1.github.io</div>
  <h1>Nabhan<br><span class="stroke">Yuzqi</span></h1>
  <p class="sub"><b>Fullstack Developer &amp; Founder</b> — Flutter · Next.js · Firebase · Gemini · IoT — Sampit, ID</p>
</body>
</html>
